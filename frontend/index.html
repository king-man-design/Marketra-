<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MARKETRA</title>
  <meta name="description" content="MARKETRA: an AI marketing manager that diagnoses your business and hands you today's briefing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: Business profile -->
  <section id="profileScreen" class="screen profile-screen">
    <div class="orb-glow"></div>
    <div class="profile-card">
      <div class="orb"></div>
      <h1>MARKETRA</h1>
      <p class="subtitle">Tell us about your business to get started</p>
      <form id="businessForm" class="profile-form">
        <input name="business_name" placeholder="Business name" required>
        <input name="industry" placeholder="Industry">
        <input name="target_customer" placeholder="Target customer">
        <input name="monthly_marketing_budget" type="number" placeholder="Monthly budget">
        <input name="current_goal" placeholder="Current goal">
        <button type="submit">OK, let's go</button>
      </form>
      <p class="profile-status" id="profileStatus"></p>
    </div>
  </section>

  <!-- SCREEN 2: Chat dashboard -->
  <section id="chatScreen" class="screen chat-screen" hidden>
    <header class="topbar">
      <button id="editProfileBtn" class="icon-btn" aria-label="Edit business profile">✎</button>
      <div class="brand-badge">
        <span class="brand-name">MARKETRA</span>
        <span class="badge">BETA</span>
      </div>
      <button id="clearBtn" class="icon-btn" aria-label="Clear conversation">⋮</button>
    </header>

    <div class="feed" id="messages">
      <article class="entry from-marketra">
        <span class="avatar"></span>
        <p>Ask what to do — try "what should I do today?"</p>
      </article>
    </div>

    <div class="plan" id="plan" hidden></div>

    <form class="composer" id="composer">
      <input id="prompt" autocomplete="off" placeholder="Enter Message">
      <button class="send" type="submit" aria-label="Send">➤</button>
    </form>
    <p class="status-line" id="statusText">checking backend…</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
