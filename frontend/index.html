<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARKETRA — AI Marketing Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-glow"></div>

  <main class="app-container">
    <!-- PAGE 1: Business Setup -->
    <section id="page-setup" class="page active">
      <div class="orb-container">
        <div class="glowing-orb"></div>
      </div>
      
      <div class="setup-header">
        <h1>MARKETRA</h1>
        <p>Tell us about your business to get started</p>
      </div>

      <form id="businessForm" class="setup-form">
        <div class="input-group">
          <input name="business_name" placeholder="Business Name (e.g. Tekzo)" required>
        </div>
        <div class="input-group">
          <input name="industry" placeholder="Industry (e.g. Family gadgets)">
        </div>
        <div class="input-group">
          <input name="target_customer" placeholder="Target Customer (e.g. Young students)">
        </div>
        <div class="input-group">
          <input name="monthly_marketing_budget" type="number" placeholder="Monthly Budget ($ or ₹)">
        </div>
        <div class="input-group">
          <input name="current_goal" placeholder="Current Goal (e.g. Reach 50 customers daily)">
        </div>

        <button type="submit" class="btn-gradient">OK, let's go</button>
      </form>
    </section>

    <!-- PAGE 2: AI Agent Chat -->
    <section id="page-chat" class="page">
      <header class="chat-header">
        <button id="backBtn" class="icon-btn" title="Edit Profile">←</button>
        <div class="agent-title">
          <span class="status-dot"></span>
          <h2>MARKETRA 1.0 <span class="badge">BETA</span></h2>
        </div>
        <button id="clearBtn" class="icon-btn" title="Clear Chat">🗑️</button>
      </header>

      <div class="chat-viewport">
        <div id="messages" class="feed">
          <div class="entry from-marketra">
            <p class="byline">MARKETRA</p>
            <p>Your business profile is locked in. How can I help drive your marketing strategy today?</p>
          </div>
        </div>

        <div id="plan" class="plan-card" hidden></div>
      </div>

      <form id="composer" class="chat-composer">
        <input id="prompt" autocomplete="off" placeholder="Enter Message...">
        <button class="send-btn" type="submit">↑</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
